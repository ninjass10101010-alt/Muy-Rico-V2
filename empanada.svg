<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" fill="none">
  <!-- Empanada - half-moon pastry with rope-crimped edge (repulgue) -->
  <defs>
    <radialGradient id="empCrust" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E4BC6C"/>
      <stop offset="45%" stop-color="#D4A24E"/>
      <stop offset="78%" stop-color="#C4863A"/>
      <stop offset="100%" stop-color="#A8742C"/>
    </radialGradient>
  </defs>

  <!-- Shadow under pastry -->
  <ellipse cx="70" cy="79" rx="46" ry="8" fill="#C4A86C" opacity="0.25"/>

  <!-- Half-moon body -->
  <path d="M26 62 A44 34 0 0 1 114 62 L26 62 Z" fill="url(#empCrust)"/>

  <!-- Flat base edge -->
  <path d="M26 62 L114 62" stroke="#8B5C1A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rope crimp along the arc: dotted stroke reads as the folded repulgue -->
  <path d="M26 62 A44 34 0 0 1 114 62" stroke="#8B5C1A" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 9.5" fill="none"/>
  <path d="M26 62 A44 34 0 0 1 114 62" stroke="#B8842E" stroke-width="1.6" fill="none" opacity="0.8"/>

  <!-- Fold line inside the crimp -->
  <path d="M34 58 A36 27 0 0 1 106 58" stroke="#B07A24" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- Baked blistering -->
  <circle cx="56" cy="44" r="2.2" fill="#D4964A" opacity="0.4"/>
  <circle cx="72" cy="38" r="1.8" fill="#D4A24E" opacity="0.35"/>
  <circle cx="86" cy="46" r="2" fill="#D4964A" opacity="0.38"/>
  <circle cx="64" cy="50" r="1.4" fill="#DEB060" opacity="0.3"/>

  <!-- Top highlight -->
  <ellipse cx="58" cy="40" rx="16" ry="6" fill="white" opacity="0.09" transform="rotate(-8 58 40)"/>
</svg>
